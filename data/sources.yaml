# Sổ đăng ký nguồn dữ liệu trong data/ (lập 02/10/2026).
#
# - Chưa nạp vào pipeline: chỉ ba file `status: corpus` đang dùng (project.md B2, cấu hình B3).
# - `authority` là cấp dự kiến theo thứ bậc nguồn ở đề xuất v2 §2, gán theo NỘI DUNG (số hiệu, chữ ký,
#   đơn vị ban hành) chứ không theo tên file; thứ bậc này còn chờ phía trường xác nhận (quyết định 7).
# - `origin`: handed_over = trường/chủ dự án bàn giao; official_site = tải tay từ site của trường;
#   third_party = trang khác đăng lại. File tải từ web được đưa vào theo quyết định của chủ dự án ngày
#   02/10/2026, ngoại lệ với mặc định "không crawl web" (project.md B2.5). Quyền dùng: ĐÃ ĐƯỢC CẤP
#   (phản hồi GVHD 03/10/2026, đề xuất v2 §9). Điểm chuẩn 2024 và xác nhận thứ bậc nguồn: thầy gửi sau.
# - Từ 12/10/2026 phần quét web nằm ở data/web/manifest.jsonl (sổ máy, spec nguồn web và trích dẫn §6.3); sổ này vẫn là sổ tay.
# - Từ 2025, Thông tư 06/2025/TT-BGDĐT đổi "Đề án tuyển sinh" thành "Thông tin tuyển sinh": văn bản
#   ngang cấp Đề án năm 2025 là TB71, năm 2026 là TB1906.
# - Đổi file thì sửa sha256 ở đây; file không khớp sha256 là file khác.
# - Thư mục theo chủ đề câu hỏi (chia 08/10/2026), một tầng; năm nằm trong tên file và `admission_year`:
#     tuyen-sinh-dai-hoc-chinh-quy/  văn bản tuyển sinh (kể cả TB71, TB1906 có nhắc học phí)
#     hoc-phi/                       học phí theo khóa, học lại, thu học phí theo học kỳ
#     ky-tuc-xa/                     mức thu tiền ở ký túc xá
#     giao-duc-quoc-phong/           các mức thu tại Trung tâm GDQP-AN
#   Chủ đề mới thì thêm thư mục cùng tầng. `file` là đường dẫn tính từ data/; code tra theo tên file
#   (experiments/sources.py) nên tên file phải duy nhất giữa các thư mục.

