# Môi trường riêng của OCR: Paddle và VietOCR ghim Torch/CUDA khác app, không chung lock.
# Phiên bản lấy từ environment.json của lần chạy cur_rotgate đã nghiệm thu; đổi thì phải kiểm
# tương đương lại với data/ocr-data (./scripts/chay-ocr.sh verify).
[project]
name = "qnuchat-ocr-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddleocr==3.7.0",
    "paddlepaddle-gpu==3.2.0",
    "paddlex[ocr]==3.7.2",
    # VietOCR 0.3.13 dùng pkg_resources, đã bị bỏ từ setuptools 81.
    "setuptools<81",
    "torch==2.14.1+cu132",
    "torchvision",
    "vietocr==0.3.13",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Gói khác tên nhưng cùng đường dẫn file: để cả hai thì thứ tự cài song song quyết định bản nào còn,
# ra hỗn hợp hai phiên bản và Paddle chết ở lần conv đầu (libcudnn 9.24 cạnh libcudnn_cnn 9.5).
# Mỗi thư viện giữ một bản: cuDNN, NCCL theo Torch; OpenCV theo bản paddlex ghim.
override-dependencies = [
    "nvidia-cudnn-cu12; sys_platform == 'never'",
    "nvidia-nccl-cu12; sys_platform == 'never'",
    "opencv-python; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
