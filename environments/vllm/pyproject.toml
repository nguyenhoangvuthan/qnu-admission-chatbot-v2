# Môi trường riêng của vLLM: lock độc lập với app vì vLLM ghim Torch/Transformers khác app.
# Phiên bản bám môi trường đã nghiệm thu; nâng thì đổi ở đây, `uv lock`, rồi đo lại.
[project]
name = "qnuchat-vllm-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm==0.33.0",
    # Khai trực tiếp: tool.uv.sources không áp dụng cho dependency bắc cầu.
    "torch==2.14.0+cu132",
    "torchaudio==2.11.0+cpu",
    "torchcodec==0.17.0+cu132",
    "torchvision==0.29.0+cu132",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
